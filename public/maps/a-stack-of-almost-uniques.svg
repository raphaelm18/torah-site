<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" fill="none" font-family="Georgia, serif">
  <title>No single piece is unique. The stack is.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E1A16"/></marker>
  </defs>
  <rect width="760" height="420" fill="#FBF8F3"/>
  <text x="24" y="34" fill="#1E1A16" font-size="17" font-weight="bold">No single piece is unique. The stack is.</text>
  <rect x="24" y="58" width="340" height="232" rx="6" stroke="#1E1A16" stroke-width="1.25"/>
  <rect x="396" y="58" width="340" height="232" rx="6" stroke="#1E1A16" stroke-width="1.25"/>
  <text x="44" y="86" fill="#1E1A16" font-size="15" font-weight="bold">Mechanisms: how it's built</text>
  <text x="44" y="104" fill="#6B635A" font-size="12.5" font-style="italic">the theory</text>
  <g fill="#1E1A16" font-size="14">
    <text x="44" y="136">Text and canonized dissent</text>
    <text x="44" y="164">A tether to the canon</text>
    <text x="44" y="192">Literacy and the weekly portion</text>
    <text x="44" y="220">Practice over creed</text>
    <text x="44" y="248">Portable sacred time: Shabbat</text>
    <text x="44" y="276">Arguing with God</text>
  </g>
  <text x="416" y="86" fill="#1E1A16" font-size="15" font-weight="bold">Outcomes: what happened</text>
  <text x="416" y="104" fill="#6B635A" font-size="12.5" font-style="italic">the evidence</text>
  <g fill="#1E1A16" font-size="14">
    <text x="416" y="136">Survival without land or Temple</text>
    <text x="416" y="164">Peoplehood, not a creed</text>
    <text x="416" y="192">Christianity built on its text</text>
    <text x="416" y="220">No missionaries needed</text>
    <text x="416" y="248">A revelation claimed by a nation</text>
  </g>
  <path d="M364 174H392" stroke="#1E1A16" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M380 290V326" stroke="#1E1A16" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="200" y="330" width="360" height="64" rx="6" fill="#A2462A" fill-opacity="0.1" stroke="#A2462A" stroke-width="2"/>
  <text x="380" y="358" text-anchor="middle" fill="#1E1A16" font-size="15" font-weight="bold">A fingerprint</text>
  <text x="380" y="380" text-anchor="middle" fill="#1E1A16" font-size="13">no single ridge is special; the pattern is</text>
</svg>
