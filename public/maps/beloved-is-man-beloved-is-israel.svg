<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" fill="none" font-family="Georgia, serif">
  <title>Birth gives membership, not worth</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E1A16"/></marker>
  </defs>
  <rect width="760" height="584" fill="#FBF8F3"/>
  <text x="24" y="34" fill="#1E1A16" font-size="17" font-weight="bold">Birth gives membership, not worth</text>
  <g stroke="#1E1A16" stroke-width="1.25">
    <path d="M380 118V145H200V172" marker-end="url(#a)"/>
    <path d="M380 118V145H560V172" marker-end="url(#a)"/>
    <path d="M560 228V282" marker-end="url(#a)"/>
    <path d="M200 228V365H320V392" marker-end="url(#a)"/>
    <path d="M560 338V365H440V392" marker-end="url(#a)"/>
    <path d="M380 448V502" marker-end="url(#a)"/>
  </g>
  <text x="396" y="138" fill="#6B635A" font-size="12.5" font-style="italic">two claims tangled together</text>
  <g stroke="#1E1A16" stroke-width="1.25">
    <rect x="250" y="62" width="260" height="56" rx="6"/>
    <rect x="70" y="172" width="260" height="56" rx="6"/>
    <rect x="430" y="172" width="260" height="56" rx="6"/>
    <rect x="430" y="282" width="260" height="56" rx="6"/>
    <rect x="250" y="502" width="260" height="56" rx="6"/>
  </g>
  <rect x="250" y="392" width="260" height="56" rx="6" fill="#A2462A" fill-opacity="0.1" stroke="#A2462A" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="380" y="86" fill="#1E1A16" font-size="15" font-weight="bold">The ache: Refa'enu</text>
    <text x="380" y="104" fill="#6B635A" font-size="12.5">why pray for health only for Israel?</text>
    <text x="200" y="196" fill="#1E1A16" font-size="15" font-weight="bold">Priority</text>
    <text x="200" y="214" fill="#6B635A" font-size="12.5">give to your own first: defensible</text>
    <text x="560" y="196" fill="#1E1A16" font-size="15" font-weight="bold">Superiority</text>
    <text x="560" y="214" fill="#6B635A" font-size="12.5">worth by birth: the real ick</text>
    <text x="560" y="306" fill="#1E1A16" font-size="15" font-weight="bold">Tested against halakha</text>
    <text x="560" y="324" fill="#6B635A" font-size="12.5">character counts, but birth sticks</text>
    <text x="380" y="416" fill="#1E1A16" font-size="15" font-weight="bold">Family, not aristocracy</text>
    <text x="380" y="434" fill="#1E1A16" font-size="12.5">membership and obligation, not worth</text>
    <text x="380" y="526" fill="#1E1A16" font-size="15" font-weight="bold">The broken verse</text>
    <text x="380" y="544" fill="#6B635A" font-size="12.5">each camp keeps half of Avot 3:14</text>
  </g>
</svg>
