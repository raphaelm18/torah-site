<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" fill="none" font-family="Georgia, serif">
  <title>The firstborn keeps the rules alive</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E1A16"/></marker>
  </defs>
  <rect width="760" height="592" fill="#FBF8F3"/>
  <text x="24" y="32" fill="#1E1A16" font-size="17" font-weight="bold">The firstborn keeps the rules alive</text>
  <g font-size="12" fill="#6B635A">
    <rect x="24" y="48" width="12" height="12" rx="2" stroke="#1E1A16"/>
    <text x="42" y="58">Claim</text>
    <rect x="96" y="48" width="12" height="12" rx="2" stroke="#1E1A16" stroke-dasharray="3 2"/>
    <text x="114" y="58">Pushback</text>
    <rect x="188" y="48" width="12" height="12" rx="2" fill="#A2462A" fill-opacity="0.12" stroke="#A2462A" stroke-width="1.5"/>
    <text x="206" y="58">Refinement</text>
  </g>
  <g stroke="#1E1A16" stroke-width="1.25">
    <path d="M380 136V156" marker-end="url(#a)"/>
    <path d="M380 208V228" marker-end="url(#a)"/>
    <path d="M380 280V300" marker-end="url(#a)"/>
    <path d="M380 352V372" marker-end="url(#a)"/>
    <path d="M380 424V444" marker-end="url(#a)"/>
    <path d="M380 496V516" marker-end="url(#a)"/>
  </g>
  <rect x="200" y="84" width="360" height="52" rx="6" stroke="#1E1A16" stroke-width="1.25"/>
  <g stroke="#1E1A16" stroke-width="1.25" stroke-dasharray="5 3">
    <rect x="200" y="156" width="360" height="52" rx="6"/>
    <rect x="200" y="300" width="360" height="52" rx="6"/>
    <rect x="200" y="444" width="360" height="52" rx="6"/>
  </g>
  <g fill="#A2462A" fill-opacity="0.1" stroke="#A2462A" stroke-width="2">
    <rect x="200" y="228" width="360" height="52" rx="6"/>
    <rect x="200" y="372" width="360" height="52" rx="6"/>
    <rect x="200" y="516" width="360" height="52" rx="6"/>
  </g>
  <g font-size="12" fill="#6B635A">
    <text x="222" y="104">Claim (Part 2)</text>
    <text x="222" y="176">Pushback</text>
    <text x="222" y="248">Refinement</text>
    <text x="222" y="320">Pushback</text>
    <text x="222" y="392">Refinement</text>
    <text x="222" y="464">Pushback</text>
    <text x="222" y="536">Refinement</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#1E1A16">
    <text x="222" y="124">We're one instrument among many</text>
    <text x="222" y="196">But the Torah says firstborn</text>
    <text x="222" y="268">The firstborn gets dressed first</text>
    <text x="222" y="340">Isn't that the goody two-shoes?</text>
    <text x="222" y="412">Founded by rebels who argue</text>
    <text x="222" y="484">Max chooses freely. Isn't that better?</text>
    <text x="222" y="556">Best is commanded, and alive</text>
  </g>
</svg>
