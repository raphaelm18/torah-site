<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" fill="none" font-family="Georgia, serif">
  <title>Bound in three places, then at rest</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E1A16"/></marker>
  </defs>
  <rect width="760" height="236" fill="#FBF8F3"/>
  <text x="24" y="38" fill="#1E1A16" font-size="17" font-weight="bold">Bound in three places, then at rest</text>
  <g stroke="#1E1A16" stroke-width="1.25">
    <rect x="24" y="64" width="160" height="92" rx="6"/>
    <rect x="208" y="64" width="160" height="92" rx="6"/>
    <rect x="392" y="64" width="160" height="92" rx="6"/>
    <path d="M184 110H206" marker-end="url(#a)"/>
    <path d="M368 110H390" marker-end="url(#a)"/>
    <path d="M552 110H574" marker-end="url(#a)"/>
  </g>
  <rect x="576" y="64" width="160" height="92" rx="6" fill="#A2462A" fill-opacity="0.08" stroke="#A2462A" stroke-width="2"/>
  <g fill="#1E1A16" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="104" y="92">Arm, to the heart</text>
    <text x="288" y="92">Head, soft spot</text>
    <text x="472" y="92">Hand, the shin</text>
    <text x="656" y="92">Rest</text>
  </g>
  <g fill="#1E1A16" font-size="13" text-anchor="middle">
    <text x="104" y="116">Desire joins action</text>
    <text x="288" y="116">Thoughts to God</text>
    <text x="472" y="116">Shaddai on the body</text>
    <text x="656" y="116">Menucha, the calm</text>
  </g>
  <g fill="#6B635A" font-size="12.5" font-style="italic" text-anchor="middle">
    <text x="104" y="138">Sinai: obligated</text>
    <text x="288" y="138">Still open, growing</text>
    <text x="472" y="138">Purim: chosen</text>
    <text x="656" y="138">His will, my will</text>
  </g>
  <path d="M24 176V184H368V176" stroke="#6B635A" stroke-width="1.25"/>
  <text x="196" y="206" fill="#6B635A" font-size="12.5" font-style="italic" text-anchor="middle">No talking between arm and head</text>
</svg>
