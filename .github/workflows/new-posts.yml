name: Email new posts

on:
  push:
    branches: [main]
    paths:
      - content/posts/**

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/email-new-posts.mjs
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
